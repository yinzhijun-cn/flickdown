<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Documents may contain raw HTML: only the app's own files may run script; no inline handlers, frames or network fetches. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'unsafe-inline' file:; img-src * file: data: blob:; font-src file: data:; media-src * file:; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri file:">
<meta name="color-scheme" content="light dark">
<base id="flick-base">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --border-soft: #d1d9e0b3;
  --link: #0969da;
  --code-bg: #f6f8fa;
  --code-inline: #818b981f;
  --toc-bg: #f6f8fa;
  --toc-hover: #818b981a;
  --mark: #fff8c5;
  --note: #0969da;
  --tip: #1a7f37;
  --important: #8250df;
  --warning: #9a6700;
  --caution: #d1242f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1f22;
    --fg: #e4e6ea;
    --muted: #9ba3ae;
    --border: #3d4148;
    --border-soft: #3d414899;
    --link: #58a6ff;
    --code-bg: #26282c;
    --code-inline: #656c7640;
    --toc-bg: #191a1d;
    --toc-hover: #656c7633;
    --mark: #bb800940;
    --note: #4493f8;
    --tip: #3fb950;
    --important: #ab7df8;
    --warning: #d29922;
    --caution: #f85149;
  }
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  overflow-wrap: break-word;
}
#flick-main { padding: 36px 48px 96px; }

/* Outline sidebar */
#flick-toc {
  display: none;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  width: 260px;
  box-sizing: border-box;
  padding: 18px 10px 40px;
  overflow-y: auto;
  background: var(--toc-bg);
  border-right: 1px solid var(--border-soft);
  font-size: 13px;
  line-height: 1.45;
  -webkit-user-select: none;
  user-select: none;
}
#flick-toc-title { padding: 0 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.flick-toc-open.flick-has-toc #flick-toc { display: block; }
.flick-toc-open.flick-has-toc #flick-main { margin-left: 260px; }
#flick-toc a {
  display: block;
  padding: 4px 10px;
  border-radius: 6px;
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#flick-toc a:hover { background: var(--toc-hover); color: var(--fg); }
#flick-toc a.active { background: var(--toc-hover); color: var(--link); font-weight: 600; }
#flick-toc a[data-l="1"] { color: var(--fg); font-weight: 600; }
#flick-toc a[data-l="1"].active { color: var(--link); }
#flick-toc a[data-l="2"] { padding-left: 22px; }
#flick-toc a[data-l="3"] { padding-left: 34px; }
#flick-toc a[data-l="4"] { padding-left: 46px; }
#flick-toc a[data-l="5"] { padding-left: 58px; }
#flick-toc a[data-l="6"] { padding-left: 70px; }

/* Floating buttons: outline switch at the top left, page width switch at the top right */
#flick-toc-toggle, #flick-width {
  position: fixed;
  top: 12px;
  z-index: 10;
  padding: 3px 10px;
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  background: var(--bg);
  color: var(--muted);
  font: 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  opacity: .5;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
#flick-width { right: 16px; }
#flick-width:empty { display: none; } /* until the first render sets the width */
#flick-toc-toggle { display: none; left: 16px; }
.flick-has-toc #flick-toc-toggle { display: block; }
/* With the outline open, the button sits at the right end of its title row. */
.flick-toc-open.flick-has-toc #flick-toc-toggle { left: 250px; transform: translateX(-100%); }
#flick-toc-toggle:hover, #flick-width:hover { opacity: 1; color: var(--fg); }

/* Document */
.markdown-body { max-width: 860px; margin: 0 auto; }
[data-width="wide"] .markdown-body { max-width: 1200px; }
[data-width="full"] .markdown-body { max-width: none; }
.markdown-body > :first-child { margin-top: 0 !important; }
.markdown-body > :last-child { margin-bottom: 0 !important; }
.markdown-body [id] { scroll-margin-top: 16px; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.6em 0 .7em; font-weight: 600; line-height: 1.3; }
.markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
.markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body h5 { font-size: .875em; }
.markdown-body h6 { font-size: .85em; color: var(--muted); }
.markdown-body p, .markdown-body blockquote, .markdown-body ul, .markdown-body ol, .markdown-body dl,
.markdown-body table, .markdown-body pre, .markdown-body details, .markdown-body .flick-alert,
.markdown-body .flick-mermaid, .markdown-body .flick-math-block { margin: 0 0 1em; }
.markdown-body a { color: var(--link); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body strong { font-weight: 600; }
.markdown-body ul, .markdown-body ol { padding-left: 2em; }
.markdown-body li > ul, .markdown-body li > ol { margin: .25em 0 0; }
.markdown-body li + li { margin-top: .25em; }
.markdown-body li > p { margin: .5em 0; }
.markdown-body li.task-list-item { list-style: none; }
.markdown-body .task-list-item-checkbox { margin: 0 .4em .2em -1.5em; vertical-align: middle; }
.markdown-body blockquote { padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
.markdown-body hr { height: .25em; margin: 1.6em 0; padding: 0; border: 0; background: var(--border); }
.markdown-body img { max-width: 100%; box-sizing: content-box; }
.markdown-body mark { background: var(--mark); color: inherit; border-radius: 2px; }
.markdown-body code, .markdown-body kbd, .markdown-body pre, .markdown-body samp {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
.markdown-body code { font-size: 85%; padding: .2em .4em; border-radius: 6px; background: var(--code-inline); }
.markdown-body pre {
  font-size: 85%;
  line-height: 1.5;
  padding: 16px;
  overflow: auto;
  border-radius: 8px;
  background: var(--code-bg);
  tab-size: 4;
}
.markdown-body pre code, .markdown-body pre code.hljs {
  display: inline;
  padding: 0;
  font-size: 100%;
  background: transparent;
  border-radius: 0;
  white-space: pre;
}
.markdown-body kbd {
  display: inline-block;
  padding: .15em .4em;
  font-size: 80%;
  line-height: 1;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--code-bg);
}
.markdown-body table { display: block; width: max-content; max-width: 100%; overflow: auto; border-collapse: collapse; border-spacing: 0; }
.markdown-body th, .markdown-body td { padding: 6px 13px; border: 1px solid var(--border); }
.markdown-body th { font-weight: 600; }
.markdown-body tr:nth-child(2n) { background: var(--code-bg); }
.markdown-body details > summary { cursor: pointer; }
.markdown-body .footnotes { margin-top: 2em; padding-top: 1em; font-size: 85%; color: var(--muted); border-top: 1px solid var(--border-soft); }
.markdown-body .footnote-backref { margin-left: .25em; }
.markdown-body x-spoiler { background: var(--muted); color: transparent; border-radius: 3px; }
.markdown-body x-spoiler:hover { background: transparent; color: inherit; }

/* GitHub-style alerts: > [!NOTE] */
.flick-alert { --alert: var(--border); }
.markdown-body .flick-alert { padding: .5em 1em; border-left: .25em solid var(--alert); }
.markdown-body .flick-alert > .admonition-title { margin: 0 0 .25em; font-weight: 600; color: var(--alert); }
.markdown-body .flick-alert > :last-child { margin-bottom: 0; }
.flick-alert-note { --alert: var(--note); }
.flick-alert-tip { --alert: var(--tip); }
.flick-alert-important { --alert: var(--important); }
.flick-alert-warning { --alert: var(--warning); }
.flick-alert-caution { --alert: var(--caution); }

/* Math and diagrams show their source until the lazily loaded renderer replaces it. */
.markdown-body x-equation:not(.flick-done) { font-family: ui-monospace, Menlo, monospace; font-size: 85%; color: var(--muted); }
.markdown-body x-equation[type="display"] { display: block; margin: 1em 0; overflow-x: auto; overflow-y: hidden; text-align: center; }
.markdown-body .flick-math-block { overflow-x: auto; overflow-y: hidden; text-align: center; }
.markdown-body .flick-math-block:not(.flick-done), .markdown-body .flick-mermaid:not(.flick-done) {
  padding: 16px;
  font: 85%/1.5 ui-monospace, Menlo, monospace;
  white-space: pre;
  text-align: left;
  color: var(--muted);
  background: var(--code-bg);
  border-radius: 8px;
}
.markdown-body .flick-mermaid { text-align: center; }
.markdown-body .flick-mermaid svg { max-width: 100%; height: auto; }
.markdown-body .flick-mermaid.flick-error { color: var(--caution); }

/* Find in page */
::highlight(flick-find) { background-color: #fff2a8; color: inherit; }
::highlight(flick-find-current) { background-color: #ffb238; color: #1f2328; }
@media (prefers-color-scheme: dark) {
  ::highlight(flick-find) { background-color: #6b5a1866; color: inherit; }
  ::highlight(flick-find-current) { background-color: #e8a33a; color: #1e1f22; }
}

@media (max-width: 760px) {
  #flick-main { padding: 24px 20px 64px; }
  .flick-toc-open.flick-has-toc #flick-toc { display: none; }
  .flick-toc-open.flick-has-toc #flick-main { margin-left: 0; }
  #flick-toc-toggle { display: none !important; } /* the outline does not fit at this width */
}
@media print {
  #flick-toc, #flick-toc-toggle, #flick-width { display: none !important; }
  #flick-main { margin: 0 !important; padding: 0; }
  .markdown-body pre { white-space: pre-wrap; }
}
</style>
</head>
<body>
<nav id="flick-toc"><div id="flick-toc-title"></div><div id="flick-toc-list"></div></nav>
<button id="flick-toc-toggle" type="button"></button>
<button id="flick-width" type="button"></button>
<main id="flick-main"><article id="flick-content" class="markdown-body"></article></main>
</body>
</html>
